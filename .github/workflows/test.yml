name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  # CI never builds the desktop app — skip the Electron binary download
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  web-sync:
    # Fails the build if docs/ has drifted from renderer/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/sync-web.sh
      - run: git diff --exit-code -- docs/ || (echo "::error::docs/ is out of sync with renderer/ — run npm run sync:web" && exit 1)
